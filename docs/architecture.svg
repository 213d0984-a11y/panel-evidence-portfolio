<g font-size="20" font-weight="bold">
<text x="70" y="140">PDFを登録</text><text x="372" y="140">ページ別に抽出</text><text x="674" y="140">Embedding</text><text x="976" y="140">Qdrant local</text>
<text x="70" y="345">仕様を質問</text><text x="372" y="345">Hybrid検索</text><text x="674" y="345">根拠を照合</text><text x="976" y="345">原文・出典</text>
</g>
<g font-size="16">
<text x="70" y="174">原本と文書台帳を保持</text><text x="372" y="174">900文字の検索チャンク</text><text x="674" y="174">多言語E5モデル</text><text x="976" y="174">ローカル索引</text>
<text x="70" y="379">型式・仕様・適用条件</text><text x="372" y="379">Dense＋BM25＋RRF</text>
<text x="674" y="379">対象 × 項目 × 具体値</text><text x="976" y="379">引用を再検査</text>
<text x="675" y="516" font-weight="bold">根拠不足：登録資料からは確認できない</text>
<text x="675" y="542">関連語・型式の一致だけでは回答を許可しない</text>
<text x="353" y="460" fill="#176f78">検索後、元の順序と重複を処理してページを復元</text>
